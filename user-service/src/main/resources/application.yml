spring:
  application:
    name: user-service

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9094}
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5434}/users_db
    username: ${DB_USER:vbank_admin}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
